[project]
name = "more-than-a-hack-2027-possession"
version = "0.1.0"
description = "Initial ATD and Smart Tagging modelling pipeline for More Than A Hack 2027"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "pyarrow>=14,<20",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "kloppy==3.18.0",
    "opencv-python>=4.8,<5",
]

[dependency-groups]
notebook = [
    "jupyterlab>=4,<5",
    "notebook>=7,<8",
    "nbformat>=5.9,<6",
    "nbclient>=0.8,<1",
    "ipykernel>=6.25,<7",
]
modeling = [
    "torch>=2.2,<3",
]

[tool.uv]
default-groups = ["notebook"]
